version: '3.8'
services:
  db-asociacion:
    image: postgres:15-alpine
    container_name: postgres-asociacion
    restart: always
    environment:
      POSTGRES_USER: admin_asociacion
      POSTGRES_PASSWORD: Password123
      POSTGRES_DB: db_asociacion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: